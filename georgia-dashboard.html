<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Georgia Strategic Revenue — PTS Tax</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
    body { font-family: 'Inter', sans-serif; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    @keyframes bounce { 0%,100%{transform:translateY(-25%);animation-timing-function:cubic-bezier(.8,0,1,1)} 50%{transform:none;animation-timing-function:cubic-bezier(0,0,.2,1)} }
    .animate-pulse { animation: pulse 2s cubic-bezier(.4,0,.6,1) infinite; }
    .animate-bounce { animation: bounce 1s infinite; }
  </style>
</head>
<body class="bg-white text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const Icon = ({ d, size = 14, className = "" }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
        fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
        className={className}>
        <path d={d} />
      </svg>
    );

    const Icons = {
      Layers:          "M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5",
      FileCheck:       "M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M9 15l2 2 4-4",
      Users:           "M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 7a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75",
      MousePointer2:   "M4 4l7.07 17 2.51-7.39L21 11.07z",
      PhoneIncoming:   "M16 2v6h6M22 8L14.5 15.5M22 16.92v3a2 2 0 0 1-2.18 2A19.79 19.79 0 0 1 2.09 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z",
      Mail:            "M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6",
      AlertTriangle:   "M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01",
      UserMinus:       "M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zM2 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2M23 11h-6",
      ArrowRightCircle:"M12 22c5.52 0 10-4.48 10-10S17.52 2 12 2 2 6.48 2 12s4.48 10 10 10zM12 8l4 4-4 4M8 12h8",
      ShieldCheck:     "M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM9 12l2 2 4-4",
      FileSignature:   "M20 19.5v.5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8.5L18 5.5M20 19.5l-4-4m0 0L14 17m2-1.5V22",
      CheckCircle2:    "M22 11.08V12a10 10 0 1 1-5.93-9.14M22 4L12 14.01l-3-3",
    };

    const IC = ({ name, size = 14, className = "" }) => (
      <Icon d={Icons[name] || ""} size={size} className={className} />
    );

    const scoring = [
      { event: 'Signed Contract',       points: '+10', color: 'text-emerald-600', bg: 'bg-emerald-50', icon: 'FileCheck' },
      { event: 'Attended Meeting',       points: '+5',  color: 'text-blue-600',   bg: 'bg-blue-50',    icon: 'Users' },
      { event: 'Clicked "Talk to AI"',  points: '+3',  color: 'text-orange-600', bg: 'bg-orange-50',  icon: 'MousePointer2' },
      { event: 'Called Back (Missed)',   points: '+2',  color: 'text-blue-500',   bg: 'bg-blue-50',    icon: 'PhoneIncoming' },
      { event: 'Email Replied',          points: '+1',  color: 'text-slate-800',  bg: 'bg-slate-50',   icon: 'Mail' },
      { event: 'Email Bounce',           points: '-2',  color: 'text-red-400',    bg: 'bg-red-50',     icon: 'AlertTriangle' },
      { event: 'Unsubscribed',           points: '-6',  color: 'text-red-700',    bg: 'bg-red-100',    icon: 'UserMinus' },
    ];

    const StatusDot = ({ status }) => {
      const map = {
        done:    { bg: 'bg-emerald-500', label: 'Done',        text: 'text-emerald-700', light: 'bg-emerald-50 border-emerald-200' },
        active:  { bg: 'bg-blue-500',    label: 'In progress', text: 'text-blue-700',    light: 'bg-blue-50 border-blue-200' },
        pending: { bg: 'bg-amber-400',   label: 'Pending',     text: 'text-amber-700',   light: 'bg-amber-50 border-amber-200' },
        blocked: { bg: 'bg-red-500',     label: 'Blocked',     text: 'text-red-700',     light: 'bg-red-50 border-red-200' },
      };
      const s = map[status] || map.pending;
      return (
        <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-black uppercase tracking-widest border ${s.light} ${s.text}`}>
          <span className={`w-1.5 h-1.5 rounded-full ${s.bg} flex-shrink-0`} />
          {s.label}
        </span>
      );
    };

    const CheckRow = ({ label, status, note }) => {
      const icon = status === 'done' ? '✓' : status === 'active' ? '◉' : status === 'blocked' ? '✕' : '○';
      const color = status === 'done' ? 'text-emerald-600' : status === 'active' ? 'text-blue-600' : status === 'blocked' ? 'text-red-500' : 'text-amber-500';
      return (
        <div className="flex items-start gap-3 py-3 border-b border-slate-100 last:border-0">
          <span className={`font-black text-sm mt-0.5 flex-shrink-0 ${color}`}>{icon}</span>
          <div className="flex-1 min-w-0">
            <p className="text-sm font-bold text-slate-800">{label}</p>
            {note && <p className="text-xs text-slate-400 mt-0.5">{note}</p>}
          </div>
          <StatusDot status={status} />
        </div>
      );
    };

    const TwilioFAQItem = ({ q, a }) => {
      const [open, setOpen] = React.useState(false);
      return (
        <div className="border border-red-200 rounded-2xl overflow-hidden">
          <button onClick={() => setOpen(!open)} className="w-full flex items-start justify-between gap-4 p-5 text-left hover:bg-red-50 transition-colors">
            <span className="text-sm font-bold text-slate-800 leading-snug">{q}</span>
            <span className={`text-lg font-black flex-shrink-0 mt-0.5 transition-colors ${open ? 'text-red-600' : 'text-slate-300'}`}>{open ? '−' : '+'}</span>
          </button>
          {open && (
            <div className="px-5 pb-5 bg-red-50 border-t border-red-100">
              <p className="text-sm text-slate-600 leading-relaxed pt-4">{a}</p>
            </div>
          )}
        </div>
      );
    };

    const faqCategories = [
      {
        category: "About Connie",
        color: "text-orange-600",
        borderColor: "border-orange-200",
        bgColor: "bg-orange-50",
        questions: [
          {
            q: "What is Connie exactly?",
            a: "Connie is an AI voice agent that calls leads automatically. When a lead reaches 100 points in the scoring system, she calls them within 30 seconds. She qualifies them with one key question about their refund volume, and if they qualify, she books a demo with the PTS sales team. She doesn't close deals — she filters and schedules so the human team only talks to ready buyers."
          },
          {
            q: "When does Connie call?",
            a: "Monday–Friday 8am–5pm EST: Connie calls normally and a live transfer to a sales rep is available. Monday–Friday 5pm–8pm and Saturdays: Connie calls but no live transfer — the sales team follows up the next business day. Sundays for cold FOIA list leads: Connie does not call."
          },
          {
            q: "What does Connie ask leads?",
            a: "Her primary qualifying question is: \"How many refunds did your office e-file last season?\" If the answer is 50 or more → high priority, passes to sales. If 1–49 → stays in the standard pipeline (MitHub scope). If zero bank products → the lead is disqualified and not booked. Connie will not schedule a meeting with someone who has zero bank products."
          },
          {
            q: "What happens after Connie qualifies someone?",
            a: "Connie books a demo directly into the sales calendar. Erick receives a notification with the lead's name and the scheduled time. The sales team runs the demo. The lead's score, qualification answers, and booking link are all logged in Zoho CRM automatically."
          },
          {
            q: "Does Connie identify herself as an AI?",
            a: "Yes. She introduces herself as \"Connie from PTS.\" She does not use the name of a specific sales rep — she always says \"a sales representative\" when referring handoffs. If a lead asks to speak with a human immediately, Connie transfers them without asking additional questions."
          },
        ]
      },
      {
        category: "About the Campaigns",
        color: "text-blue-700",
        borderColor: "border-blue-200",
        bgColor: "bg-blue-50",
        questions: [
          {
            q: "What is AFSP and why does it matter?",
            a: "AFSP stands for Annual Filing Season Program — a voluntary IRS certification that tax preparers don't need to operate legally. If someone got it, they chose to invest in their professional development. That's the signal: they take the business seriously, they have real clients, and they're actively trying to grow. That's why Wave 1 targets them first — they're the warmest audience."
          },
          {
            q: "Why are specific cities prioritized in Wave 2?",
            a: "In 18 specific Georgia cities, a large share of the population relies on the IRS refund as one of their biggest annual income events. In those markets, refund advances aren't optional — clients walk in every season expecting them. A preparer who doesn't offer that product loses clients to the shop next door. That built-in demand makes them high-priority leads even without the AFSP credential."
          },
          {
            q: "What's the difference between 'Email + Connie call' and 'Connie call only'?",
            a: "Some leads have both a verified email and a phone number — they get both channels: a SmartLead email sequence and a Connie call. Leads with only a phone number get Connie calls only. Leads with only an email get the SmartLead sequence only. The contact channel is determined by what Clay found during enrichment."
          },
          {
            q: "When does the next wave start?",
            a: "Wave 2 starts only after Wave 1 is actively running. Wave 3 starts only after Waves 1 and 2 are both underway. Wave 4 (adjacent businesses like accountants and bookkeepers) starts once the first three waves are showing conversions. Yeison does not start a new wave until the previous one is confirmed active. This is intentional — waves are sequential and mutually exclusive."
          },
          {
            q: "What happens to leads who don't have 'tax' in their business name?",
            a: "They go to Wave 4 (GA_ADJACENT), which targets accountants, bookkeepers, payroll firms, and financial services businesses. Wave 4 is email-only for now — no Connie calls yet — because these leads need more education before they're ready for a pitch. Wave 4 is the lowest priority and only activates once the first three waves are converting."
          },
        ]
      },
      {
        category: "Scoring & the CRM",
        color: "text-slate-700",
        borderColor: "border-slate-200",
        bgColor: "bg-slate-50",
        questions: [
          {
            q: "How does the lead scoring system work?",
            a: "Every action a lead takes changes their score: Signed contract (+10 pts), Attended meeting (+5), Clicked 'Talk to AI' (+3), Called back a missed call (+2), Replied to an email (+1), Email bounced (-2), Unsubscribed (-6). Leads above 100 points trigger a Connie call automatically. Leads above 80 points are worked by the human sales team. The CRM sorts by score so the highest-priority leads always surface first."
          },
          {
            q: "What is 'Low Fit' vs 'Non-ICP / Zero BP'?",
            a: "Low Fit means the lead has 1–49 bank products per season — they're below ideal volume but still worth keeping in the pipeline (MitHub scope). Non-ICP / Zero BP means the lead has zero bank products — Connie should NOT book them for a demo. They get marked as Disqualified in Zoho CRM. This distinction is critical: booking a zero-BP lead wastes sales team time and distorts conversion metrics."
          },
          {
            q: "Where do I see my leads?",
            a: "All leads are in Zoho CRM, sorted by score. Connie-qualified leads have the booking time pre-filled. You can filter by campaign (GA_CERTIFIED, GA_HIGHDEMAND, GA_REST) and by score threshold. If you need access to the CRM or aren't sure how to filter, contact Yeison."
          },
          {
            q: "Can I add or remove leads manually?",
            a: "Contact Yeison. He manages the Clay → SmartLead pipeline and all CRM mapping. Don't manually edit the source list — any changes need to go through the pipeline so that enrichment data, scoring, and campaign assignment stay consistent."
          },
        ]
      },
      {
        category: "Compliance & Legal",
        color: "text-red-700",
        borderColor: "border-red-200",
        bgColor: "bg-red-50",
        questions: [
          {
            q: "Is it legal for Connie to call people from the FOIA list?",
            a: "The FOIA list is a public IRS directory of registered tax preparers — these are business numbers, not personal cell phones. Calling them has less regulatory exposure than calling consumers. However, if Connie is making automated calls without prior consent, there is still risk under TCPA. Two compliant options: (A) Connie calls only if the lead replied to the email first — that reply is implicit opt-in. (B) Tony signs a written authorization accepting the risk of cold outreach. Option A is always the safer path. Option B requires Tony's explicit written consent before activation."
          },
          {
            q: "What is the STOP / opt-out rule?",
            a: "If any lead replies STOP to an SMS, they must be immediately removed from all automated outreach. Twilio handles the SMS block automatically, but Zoho CRM must also be updated to Do Not Contact so that no human on the team accidentally calls or emails them. Ignoring an opt-out is a separate legal violation for every message sent after. This is non-negotiable."
          },
          {
            q: "What is A2P registration and why is SMS on hold?",
            a: "A2P (Application-to-Person) registration is required before any phone number can send SMS at volume through the carrier network. Without it, AT&T and T-Mobile filter or block the messages. PTS Tax's numbers are currently being registered with Twilio (this takes 2–3 weeks). Until the registration is approved, Connie makes voice calls only — no SMS. Once approved, SMS will be enabled for all campaigns."
          },
          {
            q: "Who is responsible for compliance decisions?",
            a: "Tony, as the PTS Tax business owner. LoopHub/PTS AI provides the technology and documents every regulatory risk clearly. Any decision to activate cold outreach (calling people who haven't opted in) requires Tony's explicit written authorization. The technology team does not make that call on his behalf."
          },
          {
            q: "What is the Emergency Call Registration fee?",
            a: "Twilio requires a one-time Emergency Call Registration for each phone number. If it's not completed, there's a $75 fee per number. This is a separate step from A2P registration. Both need to be done before full SMS and call operations go live. This is being handled by Mauricio as part of the current Twilio compliance process."
          },
        ]
      },
      {
        category: "Roles & Who to Contact",
        color: "text-emerald-700",
        borderColor: "border-emerald-200",
        bgColor: "bg-emerald-50",
        questions: [
          {
            q: "Who do I contact if Connie books a bad lead (Non-ICP)?",
            a: "Report it to Alejandra. The AI prompting is being adjusted so that Connie asks about bank products in the first 2–3 interactions and disqualifies leads with zero bank products before booking anything. If you see a bad booking in the calendar, flag it with the lead's name and the number of bank products they said they have."
          },
          {
            q: "Who manages the email campaigns?",
            a: "Krystal writes the email sequences (3 emails per wave). Yeison connects Clay → SmartLead via API and manages the technical pipeline. Questions about email content → Krystal. Questions about delivery, filtering, or CRM sync → Yeison."
          },
          {
            q: "Who do I contact for a CRM or pipeline issue?",
            a: "Yeison handles all CRM (Zoho) issues, the Clay enrichment pipeline, and the SmartLead → CRM sync. If a lead isn't showing up, a score looks wrong, or a wave isn't running — contact Yeison with the specific lead name or email so he can trace it through the pipeline."
          },
          {
            q: "Who handles Connie's voice script and qualification logic?",
            a: "Alejandra manages Connie's prompting and fine-tuning. Jason handles technical SMS fixes (session memory, response timing, handoff behavior). If Connie said something unexpected or booked incorrectly, report it to Alejandra with the lead's name and what Connie said, so the prompting can be corrected."
          },
        ]
      },
    ];

    const FAQItem = ({ q, a, accentColor, bgColor }) => {
      const [open, setOpen] = React.useState(false);
      return (
        <div
          className={`border border-slate-200 rounded-2xl overflow-hidden transition-all`}
        >
          <button
            onClick={() => setOpen(!open)}
            className="w-full flex items-start justify-between gap-4 p-5 text-left hover:bg-slate-50 transition-colors"
          >
            <span className="text-sm font-bold text-slate-800 leading-snug">{q}</span>
            <span className={`text-lg font-black flex-shrink-0 mt-0.5 ${open ? accentColor : 'text-slate-300'} transition-colors`}>
              {open ? '−' : '+'}
            </span>
          </button>
          {open && (
            <div className={`px-5 pb-5 ${bgColor} border-t border-slate-100`}>
              <p className="text-sm text-slate-600 leading-relaxed pt-4">{a}</p>
            </div>
          )}
        </div>
      );
    };

    const FAQ = () => {
      const [activeCategory, setActiveCategory] = React.useState(0);
      const cat = faqCategories[activeCategory];
      return (
        <div className="space-y-6">
          {/* Category tabs */}
          <div className="flex flex-wrap gap-2">
            {faqCategories.map((c, i) => (
              <button
                key={i}
                onClick={() => setActiveCategory(i)}
                className={`px-4 py-2 rounded-xl text-xs font-black uppercase tracking-widest transition-all border ${
                  activeCategory === i
                    ? `${c.bgColor} ${c.color} ${c.borderColor}`
                    : 'bg-white text-slate-400 border-slate-200 hover:border-slate-300'
                }`}
              >
                {c.category}
              </button>
            ))}
          </div>
          {/* Questions */}
          <div className="space-y-2">
            {cat.questions.map((item, i) => (
              <FAQItem
                key={i}
                q={item.q}
                a={item.a}
                accentColor={cat.color}
                bgColor={cat.bgColor}
              />
            ))}
          </div>
        </div>
      );
    };

    const App = () => (
      <div className="min-h-screen bg-white text-slate-900">

        {/* HEADER */}
        <header className="border-b border-slate-200 bg-white sticky top-0 z-50 shadow-sm">
          <div className="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-6">
            <div className="flex items-center gap-4">
              <div className="bg-slate-900 p-2.5 rounded-xl shadow-lg">
                <IC name="Layers" size={24} className="text-white" />
              </div>
              <div>
                <h1 className="text-xl font-black uppercase tracking-tight text-slate-900 leading-none">
                  Georgia Strategic <span className="text-blue-700">Revenue</span>
                </h1>
                <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1 italic">
                  Unified Operational Directives — PTS Tax 2026
                </p>
              </div>
            </div>
            <div className="flex gap-8">
              <div className="text-right">
                <p className="text-xs font-black text-slate-400 uppercase tracking-tighter">Original List</p>
                <p className="text-lg font-black text-slate-800 tracking-tighter">21,391</p>
              </div>
              <div className="text-right border-l border-slate-200 pl-8">
                <p className="text-xs font-black text-blue-700 uppercase tracking-tighter">Reachable</p>
                <p className="text-lg font-black text-slate-800 tracking-tighter">7,531</p>
              </div>
            </div>
          </div>
        </header>

        <main className="max-w-5xl mx-auto p-6 space-y-24 mt-12 pb-32">

          {/* BASE NUMBERS */}
          <section className="space-y-8">
            <div className="text-center space-y-2">
              <h2 className="text-3xl font-black uppercase tracking-tighter text-slate-900">
                The real <span className="text-blue-700">numbers</span>
              </h2>
              <p className="text-slate-500 text-base max-w-2xl mx-auto">
                From 21,391 tax preparers in Georgia pulled from IRS public records, only 7,531 have a phone or email to reach them. The rest are discarded.
              </p>
            </div>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              {[
                { label: "Original list",          value: "21,391", color: "border-slate-300" },
                { label: "No contact (discarded)", value: "13,860", color: "border-red-300"   },
                { label: "Verified email",         value: "921",    color: "border-blue-400"  },
                { label: "Phone only (Connie)",    value: "6,610",  color: "border-orange-400"},
              ].map((s, i) => (
                <div key={i} className={`p-6 rounded-3xl border-2 ${s.color} bg-white text-center shadow-sm`}>
                  <p className="text-3xl font-black text-slate-900">{s.value}</p>
                  <p className="text-xs text-slate-500 mt-2 font-semibold uppercase tracking-tight">{s.label}</p>
                </div>
              ))}
            </div>
          </section>

          {/* YA LO LOGRAMOS */}
          <section className="space-y-6">
            <div className="flex items-center gap-4">
              <div>
                <p className="text-xs font-black text-emerald-600 uppercase tracking-widest">Progreso real</p>
                <h2 className="text-2xl font-black uppercase tracking-tighter text-slate-900 leading-none">Ya lo logramos</h2>
              </div>
              <div className="h-px flex-1 bg-slate-100" />
              <span className="text-xs font-black bg-emerald-600 text-white px-3 py-1.5 rounded-full uppercase tracking-widest flex-shrink-0">10 de 10 listos</span>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              {[
                { label: '21,391 preparadores identificados en Georgia', sub: 'FOIA list completa — descargada del IRS y filtrada por estado' },
                { label: '7,531 con datos de contacto verificados', sub: 'Email o teléfono confirmado — los 13,860 sin contacto se descartaron' },
                { label: '3 waves segmentadas y listas', sub: 'GA_CERTIFIED → GA_HIGHDEMAND → GA_REST — cada una con criterios distintos' },
                { label: '24 inboxes de SmartLead calentados', sub: '~700 emails/día corriendo — calentamiento completado sin quemas' },
                { label: 'Scoring automático en Zoho CRM', sub: 'Cada acción del lead suma o resta puntos — 100 pts = pasa a ventas' },
                { label: 'Connie activa — primer booking completado', sub: 'Yakubu Momodu · aprendizaje: ICP checklist ahora incluye PTIN vs EFIN' },
                { label: 'Clay pipeline operativo', sub: '50K créditos procesados · enriquecimiento de email, teléfono, AFSP, Instagram' },
                { label: 'N8N migration completada — PTS Tax', sub: 'Zapier reemplazado · flujos de automatización estables' },
                { label: 'Branded Calling activo — Sunset Finance', sub: '10 sucursales · nombre y logo aparecen en pantalla del receptor' },
                { label: 'A2P Campaign enviado a carriers', sub: 'PTS Tax — en revisión · Tony aprobó el upgrade del soporte de Twilio el 15 de Mayo — eso desbloqueó el proceso' },
              ].map((item, i) => (
                <div key={i} className="flex items-start gap-3 bg-emerald-50 border border-emerald-200 rounded-2xl px-4 py-3">
                  <span className="text-emerald-600 font-black text-base flex-shrink-0 mt-0.5">✓</span>
                  <div>
                    <p className="text-sm font-bold text-slate-800 leading-snug">{item.label}</p>
                    <p className="text-xs text-slate-500 mt-0.5 leading-relaxed">{item.sub}</p>
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* PRÓXIMOS HITOS */}
          <section className="space-y-6">
            <div className="flex items-center gap-4">
              <div>
                <p className="text-xs font-black text-blue-600 uppercase tracking-widest">Siguiente etapa</p>
                <h2 className="text-2xl font-black uppercase tracking-tighter text-slate-900 leading-none">Próximos hitos</h2>
              </div>
