          {/* NÚMEROS BASE */}
          <section className="space-y-8">
            <div className="text-center space-y-2">

                      </div>
                    ))}
                  </div>

          <section className="bg-slate-50 p-12 rounded-[48px] border border-slate-200">
            <h3 className="text-2xl font-black italic uppercase mb-10 text-center text-slate-800 tracking-tighter">

            <div className="flex flex-col md:flex-row justify-center items-center gap-10 md:gap-16 mb-8">

              <h4 className="font-black text-xs uppercase mb-8 text-slate-400 tracking-widest border-b border-slate-100 pb-4 text-center">

              </h4>

            </div>
          </section>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">

                  Connie — el bot que llama

                  Cuando un lead llega con puntaje alto o pide que lo llamen, Connie contesta en menos de 1 segundo,

                </p>
                <div className="space-y-4">
                  {[
                    { n: "01", title: "Respuesta inmediata", desc: "El lead llega a 100 puntos → Connie llama en ese momento." },
                    { n: "02", title: "Calificación",        desc: "Connie pregunta cuántos reembolsos procesaron la última temporada. Si dicen más de 50 → pasa a ventas." },

                <div className="absolute -top-4 -right-4 bg-orange-600 p-3 rounded-2xl shadow-xl animate-bounce">

                </div>

                <h3 className="text-2xl font-black text-red-700 uppercase italic tracking-tighter leading-none">
                  Aviso operativo — llamadas en frío con IA
                </h3>
              </div>
