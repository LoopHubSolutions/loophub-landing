    const StatusDot = ({ status }) => {
      const map = {
        done:    { bg: 'bg-emerald-500',              label: 'Done',        text: 'text-emerald-700', light: 'bg-emerald-50 border-emerald-200' },
        active:  { bg: 'bg-blue-500 animate-pulse',   label: 'In progress', text: 'text-blue-700',    light: 'bg-blue-50 border-blue-200' },
        pending: { bg: 'bg-amber-400',                label: 'Pending',     text: 'text-amber-700',   light: 'bg-amber-50 border-amber-200' },
        blocked: { bg: 'bg-red-500',                  label: 'Blocked',     text: 'text-red-700',     light: 'bg-red-50 border-red-200' },
      };
      const s = map[status] || map.pending;
      return (
        <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-black uppercase tracking-widest border ${s.light} ${s.text}`}>
          <span className={`w-1.5 h-1.5 rounded-full ${s.bg} flex-shrink-0`} />
          {s.label}
        </span>
      );
    };

      return (
        <div className="flex items-start gap-3 py-3 border-b border-slate-100 last:border-0">
          <span className={`font-black text-sm mt-0.5 flex-shrink-0 ${color}`}>{icon}</span>

            <p className="text-sm font-bold text-slate-800">{label}</p>
            {note && <p className="text-xs text-slate-400 mt-0.5">{note}</p>}

          <StatusDot status={status} />
        </div>
      );

          {/* ─── SECTION 4: GLOSSARY ─── */}
          <section className="space-y-8">
            <div>
              <p className="text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Reference</p>
              <h2 className="text-3xl font-black uppercase tracking-tighter leading-none text-slate-900">
                Glossary — <span className="text-slate-400">every term explained</span>
              </h2>
              <p className="text-slate-400 text-sm mt-2">If someone uses a term not on this list, ask them to define it first.</p>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              {[
                { term: 'A2P', full: 'Application to Person', plain: 'Any message sent from a system or software to a person. Everything Connie does is A2P. The opposite of a human texting from their phone.' },
                { term: 'P2P', full: 'Person to Person', plain: 'You texting a friend from your phone. We do not operate in P2P. This is why regular phone apps don\'t need carrier registration.' },
                { term: '10DLC', full: '10-Digit Long Code', plain: 'A standard local phone number like 404-555-1234, registered for A2P use. What we use for both PTS Tax and Sunset Finance. "Local feel" for the recipient.' },
                { term: 'Brand', full: 'TCR Brand Registration', plain: '"Who is sending these messages?" Your company registered with the carrier network. PTS Tax and Sunset Finance are each their own Brand. Never share a Brand between entities.' },
                { term: 'Campaign', full: 'A2P Campaign', plain: '"Why are you sending these messages?" Your declared use case. Outreach, confirmations, mixed. Each Brand can have multiple Campaigns for different purposes.' },
                { term: 'TCR', full: 'The Campaign Registry', plain: 'The central database all carriers check before allowing SMS traffic. Twilio submits your Brand and Campaign here. Think of it as the DMV for business texting.' },
                { term: 'Trust Hub', full: 'Twilio Trust Hub', plain: 'Twilio\'s compliance control center. Where you manage Business Profiles, Brands, and Campaigns. Access at console.twilio.com → Trust Hub.' },
                { term: 'Opt-in', full: 'Consent to Receive', plain: 'The person consented to receive your messages. Without documented opt-in, every automated SMS is potentially a TCPA violation. This is the legal foundation.' },
                { term: 'Opt-out', full: 'STOP Request', plain: 'The person said "no more." Must be honored immediately, permanently, within seconds. Every message sent after a STOP is a separate legal violation.' },
                { term: 'STIR/SHAKEN', full: 'Voice Auth Protocol', plain: 'Voice call verification protocol. Signs the Caller ID digitally so the receiving carrier knows the call is from who it claims. Without it = "Spam Risk" label on the recipient\'s screen.' },
                { term: 'CNAM', full: 'Caller ID Name', plain: '"PTS Tax" displayed instead of an unknown number. Costs a small monthly fee per number. Different from Branded Calling (which also shows logo and reason).' },
                { term: 'Branded Calling', full: 'Rich Call Display', plain: 'Shows company name + logo + reason for call on the recipient\'s screen before they answer. Sunset Finance\'s 10 branches already have this active.' },
                { term: 'KYC', full: 'Know Your Customer', plain: 'Twilio\'s identity verification process before granting high-volume access. They verify EIN, address, website, business ownership. Standard banking-style compliance.' },
                { term: 'Segment', full: 'SMS Billing Unit', plain: 'One SMS block = 160 characters. A 320-character message = 2 segments = double the cost. Emojis and special characters use more bytes and reduce segment size to 70 chars.' },
                { term: 'Toll-Free', full: '1-800 / 877 Numbers', plain: 'Different registration process, no $4 Brand fee. Good for corporate image. Separate carrier review process. Not what we use today but an option for scale.' },
                { term: 'Short Code', full: '5-6 Digit Numbers', plain: 'Like 12345. For massive volume (100 messages/second). Very expensive ($1,000+/month), 8–12 weeks to approve. Not our use case — too expensive for our volume.' },
                { term: 'ISV', full: 'Independent Software Vendor', plain: 'MitHub is the ISV — we build and operate the system. PTS Tax and Sunset Finance are the clients. Each client needs their own Brand. Never mix client traffic.' },
                { term: 'Messaging Service', full: 'Twilio Number Pool', plain: 'Twilio\'s pool that groups your numbers under a Campaign. Numbers must be added to a Messaging Service to send A2P traffic. The most commonly forgotten step after approval.' },
                { term: 'TCPA', full: 'Telephone Consumer Protection Act', plain: 'US federal law from 1991. $500–$1,500 per illegal call or text. Class actions can reach millions. This is the legal risk that makes compliance non-negotiable.' },
                { term: 'CTIA', full: 'Wireless Industry Association', plain: 'The trade association that sets rules carriers follow. A2P 10DLC is a CTIA initiative — not a government mandate, but carriers enforce it as if it were law.' },
              ].map((g, i) => (

          <section className="space-y-10">
            <div className="space-y-2">

            </div>
