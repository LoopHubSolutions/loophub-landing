<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Twilio — Voice & SMS Infrastructure · PTS AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
    body { font-family: 'Inter', sans-serif; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    .animate-pulse { animation: pulse 2s cubic-bezier(.4,0,.6,1) infinite; }
    html { scroll-behavior: smooth; }
  </style>
</head>
<body class="bg-white text-slate-900">
  <div id="root"></div>
  <script type="text/babel">

    /* Primitives */
    const STATUS = {
      done:    { dot:'bg-emerald-500',            label:'Done',        text:'text-emerald-700', pill:'bg-emerald-50 border-emerald-200' },
      active:  { dot:'bg-blue-500 animate-pulse', label:'In progress', text:'text-blue-700',    pill:'bg-blue-50 border-blue-200' },
      pending: { dot:'bg-amber-400',              label:'Pending',     text:'text-amber-700',   pill:'bg-amber-50 border-amber-200' },
      blocked: { dot:'bg-red-500',                label:'Blocked',     text:'text-red-700',     pill:'bg-red-50 border-red-200' },
    };
    const Badge = ({ status }) => {
      const s = STATUS[status] || STATUS.pending;
      return (
        <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold uppercase tracking-widest border ${s.pill} ${s.text}`}>
          <span className={`w-1.5 h-1.5 rounded-full flex-shrink-0 ${s.dot}`} />
          {s.label}
        </span>
      );
    };
    const CheckRow = ({ label, status, note }) => {
      const icons  = { done:'✓', active:'◉', blocked:'✕', pending:'○' };
      const colors = { done:'text-emerald-500', active:'text-blue-500', blocked:'text-red-500', pending:'text-amber-400' };
      return (
        <div className="flex items-start gap-3 py-3 border-b border-slate-100 last:border-0">
          <span className={`text-sm font-black mt-0.5 flex-shrink-0 w-4 ${colors[status]||colors.pending}`}>{icons[status]||'○'}</span>
          <div className="flex-1 min-w-0">
            <p className="text-sm font-semibold text-slate-800">{label}</p>
            {note && <p className="text-xs text-slate-400 mt-0.5">{note}</p>}
          </div>
          <Badge status={status} />
        </div>
      );
    };
    const Accordion = ({ title, subtitle, children, defaultOpen=false }) => {
      const [open, setOpen] = React.useState(defaultOpen);
      return (
        <div className="border border-slate-200 rounded-2xl overflow-hidden">
          <button onClick={() => setOpen(!open)}
            className="w-full flex items-center justify-between gap-4 px-6 py-4 text-left hover:bg-slate-50 transition-colors">
            <div>
              <p className="text-sm font-bold text-slate-900">{title}</p>
              {subtitle && <p className="text-xs text-slate-400 mt-0.5">{subtitle}</p>}
            </div>
            <span className={`text-lg font-black flex-shrink-0 transition-transform ${open?'rotate-45 text-slate-400':'text-slate-300'}`}>+</span>
          </button>
          {open && <div className="border-t border-slate-100 bg-slate-50">{children}</div>}
        </div>
      );
    };
    const Tabs = ({ tabs, children }) => {
      const [active, setActive] = React.useState(0);
      return (
        <div>
          <div className="flex gap-1 mb-6 bg-slate-100 p-1 rounded-2xl">
            {tabs.map((t,i) => (
              <button key={i} onClick={() => setActive(i)}
                className={`flex-1 py-2.5 px-4 rounded-xl text-xs font-bold uppercase tracking-widest transition-colors ${active===i?'bg-white text-slate-900 shadow-sm':'text-slate-400 hover:text-slate-600'}`}>
                {t}
              </button>
            ))}
          </div>
          {children[active]}
        </div>
      );
    };
    const SH = ({ eyebrow, title, sub, ec='text-slate-400' }) => (
      <div className="mb-8">
        {eyebrow && <p className={`text-xs font-black uppercase tracking-widest mb-2 ${ec}`}>{eyebrow}</p>}
        <h2 className="text-2xl font-black uppercase tracking-tighter text-slate-900">{title}</h2>
        {sub && <p className="text-sm text-slate-400 mt-1">{sub}</p>}
      </div>
    );

    /* ── This Week ── */
    const ThisWeek = () => (
      <section id="now" className="bg-slate-950 rounded-[32px] p-8 text-white">
        <p className="text-xs font-black text-red-400 uppercase tracking-widest mb-1">Action required</p>
        <h2 className="text-2xl font-black uppercase tracking-tighter mb-6">This week</h2>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          {[
            { owner:'Mauricio', action:'Confirm A2P Campaign status with Twilio Support', note:'Ticket open — need ETA on approval', urgent:true },
            { owner:'Mauricio', action:'Emergency Call Registration on all PTS Tax numbers', note:'$75/number penalty if skipped', urgent:true },
            { owner:'Yeison',   action:'STOP → Zoho Do Not Contact sync in N8N', note:'Twilio blocks the number; CRM also needs to know', urgent:false },
            { owner:'Jason',    action:'Prepare Connie SMS test plan (AT&T, T-Mobile, Xfinity)', note:'Execute once A2P is approved', urgent:false },
          ].map((item,i) => (
            <div key={i} className={`rounded-xl p-4 flex items-start gap-3 ${item.urgent?'bg-red-950 border border-red-800':'bg-slate-900 border border-slate-800'}`}>
              <div className={`w-1.5 h-1.5 rounded-full flex-shrink-0 mt-1.5 ${item.urgent?'bg-red-500':'bg-slate-600'}`} />
              <div className="flex-1">
                <div className="flex items-center gap-2 mb-0.5">
                  <span className="text-xs font-black text-slate-400 uppercase tracking-widest">{item.owner}</span>
                  {item.urgent && <span className="bg-red-600 text-white text-xs font-black px-2 py-0.5 rounded-full uppercase tracking-widest">Urgent</span>}
                </div>
                <p className="text-sm font-semibold text-white leading-snug">{item.action}</p>
                <p className="text-xs text-slate-500 mt-0.5">{item.note}</p>
              </div>
            </div>
          ))}
        </div>
      </section>
    );

    /* ── Progress ── */
    const Progress = () => (
      <section>
        <Tabs tabs={['Already done','Upcoming']}>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
            {[
              { label:'Twilio account active', note:'Both clients have console access' },
              { label:'Business Profile — PTS Tax', note:'EIN registered, address confirmed' },
              { label:'Brand (TCR) submitted', note:'PTS Tax — under review, 24–72h' },
              { label:'A2P Campaign submitted', note:'PTS Tax — Tony approved support upgrade May 15' },
              { label:'Branded Calling — Sunset Finance', note:'10 branches — company name shows on screen' },
              { label:'Twilio numbers purchased', note:'Assigned per client, ready to attach' },
              { label:'SHAFT rules documented', note:'Team knows prohibited content and why' },
              { label:'Connie connected to Twilio', note:'Voice integration working' },
            ].map((item,i) => (
              <div key={i} className="flex items-start gap-3 bg-emerald-50 border border-emerald-200 rounded-xl p-4">
                <span className="text-emerald-600 font-black flex-shrink-0 mt-0.5">✓</span>
                <div>
                  <p className="text-sm font-bold text-slate-900">{item.label}</p>
                  <p className="text-xs text-slate-500 mt-0.5">{item.note}</p>
                </div>
              </div>
            ))}
          </div>
          <div className="space-y-2">
            {[
              { dot:'bg-amber-400', when:'This week',    label:'A2P Campaign approved — PTS Tax', note:'Triggered by support upgrade May 15' },
              { dot:'bg-amber-400', when:'This week',    label:'Emergency Call Registration — all numbers', note:'Mauricio in console before scaling SMS' },
              { dot:'bg-blue-500',  when:'Next 2 weeks', label:'Connie SMS live — PTS Tax carrier tests', note:'Jason runs AT&T, T-Mobile, Xfinity' },
              { dot:'bg-blue-500',  when:'Week 3',       label:'Sunset Finance Brand + Profile initiated', note:'Starts after PTS Tax fully operational' },
              { dot:'bg-slate-400', when:'Jun 1, 2026',  label:'SMS live — Sunset Finance', note:'Goal: A2P complete before June 1' },
            ].map((m,i) => (
              <div key={i} className="flex items-center gap-4 p-4 rounded-xl border border-slate-100 hover:bg-slate-50 transition-colors">
                <span className={`w-2.5 h-2.5 rounded-full flex-shrink-0 ${m.dot}`} />
                <div className="flex-1">
                  <p className="text-sm font-semibold text-slate-900">{m.label}</p>
                  <p className="text-xs text-slate-400 mt-0.5">{m.note}</p>
                </div>
                <span className="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1 rounded-full flex-shrink-0 whitespace-nowrap">{m.when}</span>
              </div>
            ))}
          </div>
        </Tabs>
      </section>
    );

    /* ── Anchor Nav ── */
    const AnchorNav = () => (
      <div className="sticky top-[73px] z-40 bg-white border-b border-slate-100 -mx-6 px-6">
        <div className="max-w-5xl mx-auto flex gap-1 overflow-x-auto py-2">
          {[['#status','Status'],['#how','How it works'],['#glossary','Glossary'],['#steps','The 4 Steps'],['#rules','Rules'],['#checklist','Checklist'],['#team','Team'],['#faq','FAQ']].map(([href,label]) => (
            <a key={href} href={href} className="flex-shrink-0 px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-widest text-slate-400 hover:text-slate-700 hover:bg-slate-50 transition-colors whitespace-nowrap">{label}</a>
          ))}
        </div>
      </div>
    );

    /* ── Status by client ── */
    const Status = () => (
      <section id="status">
        <SH eyebrow="May 2026" title="Status by client" />
        <Tabs tabs={['PTS Tax','Sunset Finance','FOIA List']}>
          <div className="rounded-2xl border-2 border-blue-200 overflow-hidden">
            <div className="bg-blue-700 px-6 py-3 flex items-center justify-between">
              <span className="text-white font-black uppercase tracking-tight">PTS Tax — Connie SMS</span><Badge status="active" />
            </div>
            <div className="p-5 bg-white">
              <CheckRow label="Business Profile" status="done" note="EIN registered, address confirmed" />
              <CheckRow label="Brand (TCR)" status="active" note="Submitted — awaiting TCR approval (24–72h)" />
              <CheckRow label="A2P Campaign" status="active" note="In progress with Twilio support" />
              <CheckRow label="Numbers → Messaging Service" status="pending" note="Blocked until Campaign approved" />
              <CheckRow label="Emergency Call Registration" status="pending" note="$75/number if skipped — do before scaling" />
              <CheckRow label="Connie SMS tests (AT&T, T-Mobile, Xfinity)" status="pending" note="Jason runs tests post A2P approval" />
              <CheckRow label="STOP → N8N → Zoho Do Not Contact" status="pending" note="Yeison connects opt-out to CRM" />
              <CheckRow label="Opt-in documented in Campaign" status="pending" note="Leads from Facebook Ads — confirm opt-in flow recorded" />
            </div>
          </div>
          <div className="rounded-2xl border-2 border-orange-200 overflow-hidden">
            <div className="bg-orange-600 px-6 py-3 flex items-center justify-between">
              <span className="text-white font-black uppercase tracking-tight">Sunset Finance — Tommy SMS</span><Badge status="pending" />
            </div>
            <div className="p-5 bg-white">
              <CheckRow label="Branded Calling (10 branches)" status="done" note="Company name shows on screen when Tommy calls" />
              <CheckRow label="Business Profile (Sunset entity)" status="pending" note="Separate EIN, separate profile — not PTS Tax" />
              <CheckRow label="Brand (TCR)" status="pending" note="Starts after PTS Tax A2P is approved" />
              <CheckRow label="A2P Campaign" status="pending" note="Required before SMS launch June 1" />
              <CheckRow label="Numbers → Messaging Service" status="pending" note="50 numbers total (5 per branch × 10 branches)" />
              <CheckRow label="Emergency Call Registration" status="pending" note="All 50 branch numbers" />
            </div>
          </div>
          <div className="rounded-2xl border-2 border-slate-200 overflow-hidden">
            <div className="bg-slate-700 px-6 py-3 flex items-center justify-between">
              <span className="text-white font-black uppercase tracking-tight">FOIA List — Cold outbound voice</span><Badge status="pending" />
            </div>
            <div className="p-5 bg-white">
              <CheckRow label="Separate number (not mixing with main)" status="done" note="Agreed — contamination risk avoided" />
              <CheckRow label="Connie opt-out logic" status="done" note="Implemented — prospect says no → immediately marked" />
              <CheckRow label="Tony written authorization (TCPA risk)" status="pending" note="Verbal only so far — needs email or signed doc before launch" />
              <CheckRow label="Campaign registered with correct use case" status="pending" note="Must be outreach — be honest with use case" />
            </div>
            <div className="bg-amber-50 border-t border-amber-200 px-5 py-4">
              <p className="text-xs font-black text-amber-700 uppercase tracking-widest mb-1">Legal context</p>
              <p className="text-xs text-slate-600 leading-relaxed">FOIA list = no prior consent. Safe path: Connie calls only if prospect replied to the SmartLead email (reply = implied consent). Alternative: Tony signs written authorization accepting TCPA risk ($500–$1,500 × calls if challenged).</p>
            </div>
          </div>
        </Tabs>
      </section>
    );

    /* ── How it works ── */
    const HowItWorks = () => (
      <section id="how">
        <SH eyebrow="The basics" title="How Twilio actually works" sub="One paragraph. Read it once. Everything else makes sense after this." />
        <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-5">
          {[
            { title:'Carriers', sub:'AT&T · T-Mobile · Verizon', desc:"They own the network. They decide if your message arrives. Their rules are law — no appeal guaranteed.", bg:'bg-slate-900 text-white' },
            { title:'Twilio', sub:'The intermediary', desc:"Twilio rents access to the carriers' network and resells it to you via API. It translates carrier rules into something programmable.", bg:'bg-red-600 text-white' },
            { title:'You', sub:'The sender', desc:"You send through Twilio, which sends through carriers. Follow carrier rules or lose access — Twilio's and yours.", bg:'bg-slate-100 text-slate-900' },
          ].map((c,i) => (
            <div key={i} className={`rounded-2xl p-6 ${c.bg}`}>
              <p className={`text-xs font-black uppercase tracking-widest mb-1 ${c.bg.includes('slate-1')?'text-slate-500':'opacity-60'}`}>{c.sub}</p>
              <p className="text-lg font-black uppercase tracking-tight mb-3">{c.title}</p>
              <p className={`text-xs leading-relaxed ${c.bg.includes('slate-1')?'text-slate-600':'opacity-80'}`}>{c.desc}</p>
            </div>
          ))}
        </div>
        <div className="bg-slate-50 border border-slate-200 rounded-2xl p-5 text-sm text-slate-600 leading-relaxed">
          <strong className="text-slate-900">The analogy:</strong> Twilio is the trucking company. AT&T is the highway. The government is the regulator. You're the shipper. If your cargo violates road rules, the trucking company loses its highway license — not just you. That's why Twilio is strict: every violating customer threatens the entire ecosystem's carrier access.
        </div>
      </section>
    );

    /* ── Glossary ── */
    const GLOSS = [
      { group:'Core concepts', terms:[
        { term:'A2P', full:'Application to Person', def:"Any message from a system to a person — everything Connie does is A2P." },
        { term:'P2P', full:'Person to Person', def:"You texting a friend. We don't operate in P2P." },
        { term:'Brand', full:'Your registered business identity', def:'"Who sends these messages?" — PTS Tax and Sunset Finance are each their own Brand. Never mix.' },
        { term:'Campaign', full:'Your declared use case', def:'"Why are you sending?" — Marketing, Transactional, or Mixed. Each Brand can have multiple Campaigns.' },
        { term:'TCR', full:'The Campaign Registry', def:"The central database all carriers check before allowing SMS traffic. Twilio submits your Brand and Campaign here." },
        { term:'Trust Hub', full:"Twilio's compliance HQ", def:"Where you manage Business Profiles, Brands, Campaigns. URL: console.twilio.com → Trust Hub" },
        { term:'ISV', full:'Independent Software Vendor', def:"MitHub is the ISV — we build the system. PTS Tax and Sunset Finance are clients. Each needs their own Brand." },
        { term:'Messaging Service', full:'Number pool tied to a Campaign', def:"Groups your Twilio numbers under an approved Campaign. Numbers must be added here before A2P traffic flows." },
      ]},
      { group:'Numbers', terms:[
        { term:'10DLC', full:'10-Digit Long Code', def:"A standard local number (404-555-1234) registered for A2P. What we use — local feel, moderate volume." },
        { term:'Toll-Free', full:'1-800, 1-877 numbers', def:"Different registration, no $4 Brand fee. Good for corporate image. Not what we use today." },
        { term:'Short Code', full:'5–6 digit numbers', def:"For massive volume (100 msg/sec). Expensive, 8-12 week approval. Not our use case." },
        { term:'Segment', full:'160-character SMS block', def:"One message = one segment. 320 chars = 2 segments = double the cost." },
      ]},
      { group:'Consent & compliance', terms:[
        { term:'Opt-in', full:'User consented to receive messages', def:"Without this, every SMS is a potential TCPA violation. Must be voluntary, explicit, documented." },
        { term:'Opt-out', full:'User said stop', def:"Reply STOP. Must be honored within 10 seconds. Every message sent after is a separate TCPA violation." },
        { term:'TCPA', full:'Telephone Consumer Protection Act (1991)', def:"US federal law. $500–$1,500 per illegal call or text. Class actions can reach millions." },
        { term:'CTIA', full:'Wireless industry trade association', def:"Sets the rules carriers follow. A2P 10DLC is a CTIA initiative, not just Twilio's." },
        { term:'KYC', full:'Know Your Customer', def:"Twilio's identity verification before granting high-volume access." },
      ]},
      { group:'Voice', terms:[
        { term:'STIR/SHAKEN', full:'Call verification protocol', def:"Signs the Caller ID digitally. Without it, carriers label your call Spam Risk or Scam Likely." },
        { term:'CNAM', full:'Caller ID Name', def:'"PTS Tax" instead of an unknown number on the recipient\'s screen.' },
        { term:'Branded Calling', full:'Name + logo + reason on screen', def:"Shows company logo and reason for calling. Sunset Finance 10 branches already have this." },
        { term:'Attestation', full:'STIR/SHAKEN level A / B / C', def:"A = fully verified. B = carrier knows you but can't verify number. C = unverified. Aim for A." },
      ]},
    ];
    const Glossary = () => (
      <section id="glossary">
        <SH eyebrow="Reference" title="Glossary" sub="Every term you'll see in the Twilio console — in plain English." />
        <div className="space-y-2">
          {GLOSS.map((group,gi) => (
            <Accordion key={gi} title={group.group} subtitle={`${group.terms.length} terms`} defaultOpen={gi===0}>
              <div className="p-4 grid grid-cols-1 md:grid-cols-2 gap-x-8">
                {group.terms.map((t,ti) => (
                  <div key={ti} className="py-3 border-b border-slate-200 last:border-0 md:odd:pr-8 md:even:pl-8 md:even:border-l md:even:border-slate-200">
                    <div className="flex items-baseline gap-2 flex-wrap">
                      <span className="text-sm font-black text-slate-900">{t.term}</span>
                      <span className="text-xs text-slate-400">{t.full}</span>
                    </div>
                    <p className="text-xs text-slate-600 mt-0.5 leading-relaxed">{t.def}</p>
                  </div>
                ))}
              </div>
            </Accordion>
          ))}
        </div>
      </section>
    );

    /* ── The 4 Steps ── */
    const STEPS = [
      {
        n:'01', title:'Business Profile', time:'~10 min · instant', status:'done',
        summary:'Your legal identity inside Twilio. One per legal entity. PTS Tax and Sunset Finance are separate.',
        fields:['Legal business name (must match EIN)','EIN / Tax ID','Business address','Website URL','Entity type (LLC / Corp)'],
        rule:"TCR cross-checks your info against Dun & Bradstreet. Inconsistencies = rejection. The name in Twilio must match the name on your website exactly.",
      },
      {
        n:'02', title:'Brand (TCR)', time:'24–72 hours', status:'active',
        summary:'Connects your Business Profile to TCR — the registry all carriers check. Tells them who you are.',
        fields:['Brand name (what carriers see)','Website (must match Business Profile)','Vertical / industry (Financial Services)','ISV note: "MitHub provides the system on behalf of [client]"'],
        rule:"ISV rule: register PTS Tax as PTS Tax, not as LoopHub. Each client's Brand must reflect that client's legal entity.",
        types:{
          label:'Brand type — always Standard for our clients',
          headers:['Type','Who','Daily limit (T-Mobile)','Fee'],
          rows:[
            ['Sole Proprietor','Individuals without EIN','1,000 segments/day','$0'],
            ['Low-Volume Standard','Company with EIN, moderate volume','2,000 segments/day','$4 one-time'],
            ['Standard ✓','Company with EIN, high volume','2,000+/day (scales with Trust Score)','$4 + $40 vetting'],
          ],
        },
      },
      {
        n:'03', title:'Campaign (use case)', time:'1–3 weeks', status:'active',
        summary:'Declares exactly what you\'re sending and why. Carriers evaluate this to decide if your traffic is legitimate.',
        fields:['Use type: Mixed / Marketing / Transactional','Description of what Connie says and to whom','2 sample messages (must match real scripts)','Opt-in method with proof (URL, screenshot, verbal script)','Privacy Policy URL (must mention SMS)','HELP and STOP responses declared'],
        rule:"The sample messages you submit are compared to real traffic. If Connie sends different scripts, carriers flag it. Write samples as close to the actual scripts as possible.",
        types:{
          label:'Campaign types — PTS Tax / Connie uses Mixed',
          headers:['Type','What it covers','Fee'],
          rows:[
            ['Marketing','Promos, offers, outreach','$10/month'],
            ['Transactional','Confirmations, reminders','$1.50–$10/month'],
            ['Mixed ✓','Outreach + appointment follow-ups','Both fees · separate consent per type required'],
            ['Customer Care','Support conversations','$1.50/month'],
            ['2FA / OTP','Verification codes','Use Twilio Verify instead'],
          ],
        },
      },
      {
        n:'04', title:'Numbers → Messaging Service', time:'Instant (post-approval)', status:'pending',
        summary:'Assign each phone number to the approved Campaign. Without this, zero messages go out — even with an approved Campaign.',
        fields:['Add each Connie number to the Campaign\'s Messaging Service','One Campaign per use case — outreach ≠ confirmations','PTS Tax numbers → PTS Tax Campaign only','Sunset Finance numbers → Sunset Finance Campaign only'],
        rule:"Most commonly skipped step. The Campaign passes review. You celebrate. Then silence. The numbers weren't added to the Messaging Service. Always verify this immediately after approval.",
      },
    ];
    const Steps = () => (
      <section id="steps">
        <SH eyebrow="A2P Registration" title="The 4 steps — in order" sub="Each step unlocks the next. None can be skipped." />
        <div className="space-y-3 mb-5">
          {STEPS.map((step,i) => (
            <Accordion key={i} title={`${step.n} — ${step.title}`} subtitle={`${step.summary} · ${step.time}`} defaultOpen={i<2}>
              <div className="p-6 space-y-5">
                <div className="flex items-center justify-between">
                  <p className="text-xs font-black text-slate-400 uppercase tracking-widest">Timeline: {step.time}</p>
                  <Badge status={step.status} />
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                  <div>
                    <p className="text-xs font-black text-slate-500 uppercase tracking-widest mb-3">Required fields</p>
                    <ul className="space-y-2">
                      {step.fields.map((f,j) => (
                        <li key={j} className="flex items-start gap-2 text-xs text-slate-600">
                          <span className="text-slate-300 font-black flex-shrink-0 mt-0.5">·</span>{f}
                        </li>
                      ))}
                    </ul>
                  </div>
                  <div className="bg-amber-50 rounded-xl p-4 border border-amber-200 self-start">
                    <p className="text-xs font-black text-amber-700 uppercase tracking-widest mb-2">Critical rule</p>
                    <p className="text-xs text-slate-700 leading-relaxed">{step.rule}</p>
                  </div>
                </div>
                {step.types && (
                  <div>
                    <p className="text-xs font-black text-slate-500 uppercase tracking-widest mb-3">{step.types.label}</p>
                    <div className="overflow-x-auto">
                      <table className="w-full text-xs border-collapse">
                        <thead><tr className="bg-slate-100">{step.types.headers.map((h,j) => <th key={j} className="text-left px-3 py-2 font-black text-slate-600 uppercase tracking-widest">{h}</th>)}</tr></thead>
