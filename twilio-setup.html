<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Twilio — Infraestructura de Voz y SMS · PTS AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
    body { font-family: 'Inter', sans-serif; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    .animate-pulse { animation: pulse 2s cubic-bezier(.4,0,.6,1) infinite; }
  </style>
</head>
<body class="bg-white text-slate-900">
  <div id="root"></div>

  <script type="text/babel">

    const StatusDot = ({ status }) => {
      const map = {
        done:    { bg: 'bg-emerald-500',              label: 'Hecho',       text: 'text-emerald-700', light: 'bg-emerald-50 border-emerald-200' },
        active:  { bg: 'bg-blue-500 animate-pulse',   label: 'En proceso',  text: 'text-blue-700',    light: 'bg-blue-50 border-blue-200' },
        pending: { bg: 'bg-amber-400',                label: 'Pendiente',   text: 'text-amber-700',   light: 'bg-amber-50 border-amber-200' },
        blocked: { bg: 'bg-red-500',                  label: 'Bloqueado',   text: 'text-red-700',     light: 'bg-red-50 border-red-200' },
      };
      const s = map[status] || map.pending;
      return (
        <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-black uppercase tracking-widest border ${s.light} ${s.text}`}>
          <span className={`w-1.5 h-1.5 rounded-full ${s.bg} flex-shrink-0`} />
          {s.label}
        </span>
      );
    };

    const CheckRow = ({ label, status, note }) => {
      const icon = status === 'done' ? '✓' : status === 'active' ? '◉' : status === 'blocked' ? '✕' : '○';
      const color = status === 'done' ? 'text-emerald-600' : status === 'active' ? 'text-blue-600' : status === 'blocked' ? 'text-red-500' : 'text-amber-500';
      return (
        <div className="flex items-start gap-3 py-3 border-b border-slate-100 last:border-0">
          <span className={`font-black text-sm mt-0.5 flex-shrink-0 ${color}`}>{icon}</span>
          <div className="flex-1 min-w-0">
            <p className="text-sm font-bold text-slate-800">{label}</p>
            {note && <p className="text-xs text-slate-400 mt-0.5">{note}</p>}
          </div>
          <StatusDot status={status} />
        </div>
      );
    };

    const FAQItem = ({ q, a }) => {
      const [open, setOpen] = React.useState(false);
      return (
        <div className="border border-slate-200 rounded-2xl overflow-hidden">
          <button onClick={() => setOpen(!open)} className="w-full flex items-start justify-between gap-4 p-5 text-left hover:bg-slate-50 transition-colors">
            <span className="text-sm font-bold text-slate-800 leading-snug">{q}</span>
            <span className={`text-lg font-black flex-shrink-0 mt-0.5 transition-colors ${open ? 'text-red-600' : 'text-slate-300'}`}>{open ? '−' : '+'}</span>
          </button>
          {open && (
            <div className="px-5 pb-5 bg-red-50 border-t border-red-100">
              <p className="text-sm text-slate-600 leading-relaxed pt-4">{a}</p>
            </div>
          )}
        </div>
      );
    };

    const App = () => (
      <div className="min-h-screen bg-white text-slate-900">

        {/* HEADER */}
        <header className="border-b border-slate-200 bg-white sticky top-0 z-50 shadow-sm">
          <div className="max-w-6xl mx-auto px-6">
            {/* Brand row */}
            <div className="flex items-center justify-between gap-4 py-3 border-b border-slate-100">
              <div className="flex items-center gap-3">
                <img src="/images/twilio-logo.png" alt="Twilio" className="h-7 object-contain" />
                <div className="border-l border-slate-200 pl-3">
                  <p className="text-sm font-black uppercase tracking-tight text-slate-900 leading-none">PTS AI</p>
                  <p className="text-xs text-slate-400 font-bold uppercase tracking-widest italic">Plataforma Operacional · 2026</p>
                </div>
              </div>
              <div className="flex gap-5">
                <div className="text-right">
                  <p className="text-xs font-black text-slate-400 uppercase tracking-tighter">PTS Tax</p>
                  <p className="text-sm font-black text-amber-600">A2P en proceso</p>
                </div>
                <div className="text-right border-l border-slate-200 pl-5">
                  <p className="text-xs font-black text-slate-400 uppercase tracking-tighter">Sunset Finance</p>
                  <p className="text-sm font-black text-red-600">Sin iniciar</p>
                </div>
              </div>
            </div>
            {/* Nav tabs */}
            <div className="flex gap-1 py-2">
              <a href="/georgia-dashboard" className="flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-black uppercase tracking-widest text-slate-400 hover:text-slate-700 hover:bg-slate-50 transition-colors">
                <span className="w-1.5 h-1.5 rounded-full bg-blue-500 flex-shrink-0" />
                Campaña Georgia FOIA
              </a>
              <a href="/twilio-setup" className="flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-black uppercase tracking-widest bg-red-600 text-white">
                <span className="w-1.5 h-1.5 rounded-full bg-white flex-shrink-0" />
                Twilio — Voz y SMS
              </a>
            </div>
          </div>
        </header>

        <main className="max-w-5xl mx-auto px-6 py-16 space-y-24 pb-32">

          {/* ESTA SEMANA */}
          <section className="bg-slate-950 rounded-[40px] p-10 text-white space-y-8">
            <div>
              <p className="text-xs font-black text-red-400 uppercase tracking-widest mb-2">Acción requerida ahora</p>
              <h2 className="text-3xl font-black uppercase tracking-tighter leading-none">
                Esta semana —<br />
                <span className="text-red-400">qué debe pasar</span>
              </h2>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {[
                { owner: 'Mauricio', action: 'Confirmar estado del A2P Campaign con Twilio Support', note: 'El ticket ya está abierto — necesitamos ETA de aprobación', urgent: true },
                { owner: 'Mauricio', action: 'Emergency Call Registration en todos los números de PTS Tax', note: 'Penalidad $75/número si se omite — hacerlo antes de escalar volumen', urgent: true },
                { owner: 'Yeison', action: 'STOP → Zoho Do Not Contact en N8N', note: 'Twilio bloquea el número, pero el CRM también debe actualizarse', urgent: false },
                { owner: 'Jason', action: 'Preparar plan de pruebas para Connie SMS', note: 'Probar AT&T, T-Mobile, Xfinity una vez que A2P sea aprobado', urgent: false },
              ].map((item, i) => (
                <div key={i} className={`rounded-2xl p-5 flex items-start gap-4 ${item.urgent ? 'bg-red-950 border border-red-800' : 'bg-slate-900 border border-slate-800'}`}>
                  <div className={`w-2 h-2 rounded-full flex-shrink-0 mt-1.5 ${item.urgent ? 'bg-red-500' : 'bg-slate-600'}`} />
                  <div className="flex-1">
                    <div className="flex items-center gap-2 mb-1">
                      <span className="text-xs font-black text-slate-400 uppercase tracking-widest">{item.owner}</span>
                      {item.urgent && <span className="bg-red-500 text-white text-xs font-black px-2 py-0.5 rounded-full uppercase tracking-widest">Urgente</span>}
                    </div>
                    <p className="text-sm font-bold text-white leading-snug">{item.action}</p>
                    <p className="text-xs text-slate-400 mt-1">{item.note}</p>
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* YA LO LOGRAMOS */}
          <section className="space-y-8">
            <div>
              <p className="text-xs font-black text-emerald-600 uppercase tracking-widest mb-2">Progreso real</p>
              <h2 className="text-3xl font-black uppercase tracking-tighter leading-none text-slate-900">
                Ya lo <span className="text-emerald-600">logramos</span>
              </h2>
              <p className="text-slate-400 text-sm mt-2">Esto ya está hecho. No retrocedemos de aquí.</p>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {[
                { label: 'Cuenta Twilio activa', sub: 'Ambos clientes — PTS Tax y Sunset Finance tienen acceso al console' },
                { label: 'Business Profile PTS Tax', sub: 'EIN registrado, dirección confirmada — paso 1 de 4 completado' },
                { label: 'Brand TCR enviado', sub: 'PTS Tax — en revisión con TCR, aprobación en 24–72h' },
                { label: 'A2P Campaign enviado a carriers', sub: 'PTS Tax — en revisión · Tony aprobó el upgrade del soporte de Twilio el 15 de Mayo — eso desbloqueó el proceso' },
                { label: 'Branded Calling — Sunset Finance', sub: '10 sucursales activas — el nombre de la empresa aparece en la pantalla del receptor' },
                { label: 'Números Twilio comprados', sub: 'Números asignados por cliente — listos para asignar a Campaign una vez aprobada' },
                { label: 'Reglas SHAFT documentadas', sub: 'El equipo conoce qué contenido está prohibido y por qué' },
                { label: 'Connie conectada a Twilio', sub: 'La integración de voz funciona — las llamadas salen y entran correctamente' },
              ].map((item, i) => (
                <div key={i} className="flex items-start gap-4 bg-emerald-50 border border-emerald-200 rounded-2xl p-5">
                  <span className="text-emerald-600 font-black text-lg flex-shrink-0 mt-0.5">✓</span>
                  <div>
                    <p className="text-sm font-black text-slate-900">{item.label}</p>
                    <p className="text-xs text-slate-500 mt-0.5">{item.sub}</p>
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* PRÓXIMOS HITOS */}
          <section className="space-y-8">
            <div>
              <p className="text-xs font-black text-blue-600 uppercase tracking-widest mb-2">Lo que sigue</p>
              <h2 className="text-3xl font-black uppercase tracking-tighter leading-none text-slate-900">
                Próximos <span className="text-blue-600">hitos</span>
              </h2>
            </div>
            <div className="space-y-3">
              {[
                { dot: 'bg-amber-400', when: 'Esta semana', label: 'A2P Campaign aprobado por carriers — PTS Tax', trigger: 'Desbloqueado por el upgrade de soporte de Twilio aprobado el 15 de Mayo' },
                { dot: 'bg-amber-400', when: 'Esta semana', label: 'Emergency Call Registration completado — todos los números', trigger: 'Mauricio hace esto en console antes de escalar volumen de SMS' },
                { dot: 'bg-blue-500', when: 'Próximas 2 semanas', label: 'Connie SMS en vivo — PTS Tax · pruebas AT&T, T-Mobile, Xfinity', trigger: 'Jason corre las pruebas una vez A2P aprobado' },
                { dot: 'bg-blue-500', when: 'Semana 3', label: 'Business Profile + Brand Sunset Finance iniciados', trigger: 'Empieza después de que PTS Tax esté 100% operacional' },
                { dot: 'bg-slate-400', when: '1 Junio 2026', label: 'SMS en vivo — Sunset Finance', trigger: 'Objetivo: A2P completado antes del 1 de junio' },
              ].map((m, i) => (
                <div key={i} className="flex items-start gap-4 p-5 rounded-2xl border border-slate-100 bg-white hover:bg-slate-50 transition-colors">
                  <span className={`w-3 h-3 rounded-full ${m.dot} flex-shrink-0 mt-1`} />
                  <div className="flex-1">
                    <p className="text-sm font-black text-slate-900">{m.label}</p>
                    <p className="text-xs text-slate-400 mt-0.5">{m.trigger}</p>
                  </div>
                  <span className="bg-slate-100 text-slate-600 text-xs font-black px-3 py-1 rounded-full uppercase tracking-widest flex-shrink-0">{m.when}</span>
                </div>
              ))}
            </div>
          </section>

          {/* POR QUÉ REGISTRARSE */}
          <section className="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
            <div className="space-y-5">
              <p className="text-xs font-black text-red-600 uppercase tracking-widest">Antes de tocar cualquier cosa</p>
              <h2 className="text-4xl font-black uppercase tracking-tighter leading-none text-slate-900">
                Sin registro.<br />
                <span className="text-red-600">Sin mensajes.</span>
              </h2>
              <p className="text-slate-500 text-base leading-relaxed">
                Twilio es solo el tubo. AT&T, T-Mobile y Verizon son la red real. Bloquean cualquier volumen de SMS o llamadas que no esté pre-registrado — automáticamente, algorítmicamente, sin aviso.
              </p>
              <p className="text-slate-500 text-base leading-relaxed">
                Esta página es la secuencia exacta para salir en vivo. Un paso fuera de orden y toda la campaña se bloquea.
              </p>
            </div>
            <div className="bg-slate-900 rounded-[32px] p-8 text-white space-y-4">
              <p className="text-xs font-black text-slate-400 uppercase tracking-widest">La regla del carrier</p>
              <p className="text-2xl font-black italic leading-snug text-white">
                "Si parece mensajería automatizada masiva y no está registrada — la bloqueamos."
              </p>
              <p className="text-xs text-slate-500 font-bold">— AT&T, T-Mobile, Verizon (colectivamente)</p>
            </div>
          </section>

          {/* LAS 3 REGLAS — Penalty first */}
          <section className="space-y-8">
            <div>
              <h2 className="text-2xl font-black uppercase tracking-tighter text-slate-900">3 Reglas que no se pueden romper</h2>
              <p className="text-slate-500 text-sm mt-2">No son recomendaciones. Violar cualquiera puede suspender la cuenta completa.</p>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              {[
                {
                  n: '01',
                  title: 'Consent First',
                  color: 'border-blue-300 bg-blue-50',
                  headColor: 'text-blue-700',
                  penalty: '$500–$1,500',
                  penaltySub: 'por mensaje / llamada · riesgo de demanda colectiva',
                  body: 'Antes de que Connie envíe un SMS o haga una llamada automatizada, el prospecto debe haber dado consentimiento. Para la lista FOIA: consentimiento = responder el email. Sin respuesta = sin llamada (o Tony firma la autorización de riesgo por escrito).',
                },
                {
                  n: '02',
                  title: 'STOP = Pare total',
                  color: 'border-red-300 bg-red-50',
                  headColor: 'text-red-700',
                  penalty: '$500–$1,500',
                  penaltySub: 'por mensaje enviado después del STOP · sin período de gracia',
                  body: 'Si un prospecto responde STOP a cualquier SMS, debe ser removido de todo outreach automatizado inmediatamente. Twilio bloquea el número, pero N8N debe sincronizarlo en Zoho como Do Not Contact. Cada mensaje enviado después de un STOP es una violación TCPA separada.',
                },
                {
                  n: '03',
                  title: 'Warmup de volumen',
                  color: 'border-emerald-300 bg-emerald-50',
                  headColor: 'text-emerald-700',
                  penalty: 'Número bloqueado',
                  penaltySub: 'por carrier · recuperación = número nuevo + reiniciar warmup',
                  body: 'Números nuevos empiezan despacio. Semana 1: máx 200 SMS/día por número. Semana 2: máx 500. Semana 3+: hasta ~2,000. Enviar 5,000 mensajes el día uno desde un número nuevo se ve exactamente como una botnet — el carrier lo bloquea automáticamente.',
                },
              ].map((rule, i) => (
                <div key={i} className={`rounded-3xl border-2 ${rule.color} p-8 space-y-4`}>
                  <div>
                    <span className={`text-xs font-black ${rule.headColor} uppercase tracking-widest`}>{rule.n}</span>
                    <h3 className={`text-xl font-black uppercase tracking-tight ${rule.headColor} mt-1`}>{rule.title}</h3>
                  </div>
                  <p className="text-sm text-slate-700 leading-relaxed">{rule.body}</p>
                  <div className="bg-white/80 rounded-xl p-4 border border-white space-y-1">
                    <p className="text-xs font-black text-slate-500 uppercase tracking-widest">Si se rompe</p>
                    <p className="text-2xl font-black text-red-600 leading-none">{rule.penalty}</p>
                    <p className="text-xs text-slate-500">{rule.penaltySub}</p>
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* LOS 4 PASOS */}
          <section className="space-y-10">
            <div className="space-y-2">
              <h2 className="text-2xl font-black uppercase tracking-tighter text-slate-900">
                Los 4 pasos de registro A2P
              </h2>
              <p className="text-slate-500 text-sm">En orden. Cada paso desbloquea el siguiente. No se pueden saltar.</p>
            </div>

            <div className="space-y-4">
              {[
                {
                  n: '01',
                  title: 'Business Profile',
                  headerBg: 'bg-slate-800',
                  color: 'border-slate-300',
                  desc: 'Tu identidad legal dentro de Twilio. Le dice a la red de carriers quién está enviando los mensajes.',
                  fields: ['Nombre legal del negocio (igual al EIN)', 'EIN / Tax ID', 'Dirección del negocio', 'URL del sitio web', 'Tipo de empresa (LLC / Corp / Private)'],
                  rule: 'Un Business Profile por entidad. PTS Tax y Sunset Finance son entidades separadas → perfiles separados.',
                  time: '~10 min · aprobación instantánea',
                  status: 'done',
                },
                {
                  n: '02',
                  title: 'Brand (TCR)',
                  headerBg: 'bg-blue-700',
                  color: 'border-blue-300',
                  desc: 'El Brand conecta tu Business Profile con The Campaign Registry (TCR) — la base de datos central que todos los carriers verifican antes de permitir tráfico SMS.',
                  fields: ['Nombre del brand (lo que ven los carriers)', 'Sitio web (debe coincidir con el Business Profile)', 'Vertical / industria (Financial Services)', 'Símbolo bursátil si es pública (N/A para privadas)'],
                  rule: 'TCR cruza tu información con D&B (Dun & Bradstreet). Inconsistencias = rechazo. El nombre del brand en Twilio debe coincidir con lo que aparece en el sitio web.',
                  time: '~15 min · aprobación TCR: 24–72 horas',
                  status: 'active',
                },
                {
                  n: '03',
                  title: 'Campaign (Caso de uso)',
                  headerBg: 'bg-orange-600',
                  color: 'border-orange-300',
                  desc: 'La Campaign declara exactamente qué envías y a quién. Los carriers evalúan esto para determinar si tu tráfico es legítimo.',
                  fields: [
                    'Tipo de uso: Mixed / Marketing / Conversational',
                    'Descripción: qué dice Connie, por qué, a quién',
                    'Mensajes de muestra (2 requeridos — deben coincidir con los mensajes reales)',
                    'Confirmación de opt-in: ¿cómo dieron consentimiento los prospectos?',
                    'URL de Privacy Policy (debe mencionar SMS)',
                    'Respuestas HELP / STOP declaradas',
                  ],
                  rule: 'Los mensajes de muestra que envías se comparan contra el tráfico real. Si Connie envía mensajes diferentes, los carriers lo marcan. Escribe las muestras lo más cercanas posible a los scripts reales.',
                  time: '~20 min · revisión de carriers: 1–3 semanas',
                  status: 'active',
                },
                {
                  n: '04',
                  title: 'Números → Campaign',
                  headerBg: 'bg-emerald-700',
                  color: 'border-emerald-300',
                  desc: 'Cada número de teléfono físico debe ser asignado a una Campaign. Un número sin asignación de Campaign está bloqueado para tráfico A2P.',
                  fields: [
                    'Asignar cada número de Connie a la Campaign aprobada',
                    'Una Campaign por caso de uso (outreach ≠ confirmaciones)',
                    'Números PTS Tax → Campaign PTS Tax',
                    'Números Sunset Finance → Campaign Sunset Finance (separada)',
                  ],
                  rule: 'No uses el mismo número para diferentes casos de uso. Si Connie llama para PTS Tax y Sunset Finance, se necesitan números diferentes asignados a Campaigns diferentes.',
                  time: 'Instantáneo — se hace dentro de Twilio una vez aprobada la Campaign',
                  status: 'pending',
                },
              ].map((step, i) => (
                <div key={i} className={`rounded-3xl border-2 ${step.color} overflow-hidden shadow-sm`}>
                  <div className={`${step.headerBg} px-8 py-4 flex items-center justify-between`}>
                    <div className="flex items-center gap-4">
                      <span className="bg-white/20 text-white text-xs font-black w-8 h-8 rounded-xl flex items-center justify-center">{step.n}</span>
                      <span className="text-white font-black text-base uppercase tracking-tight">{step.title}</span>
                    </div>
                    <div className="flex items-center gap-3">
                      <span className="text-white/60 text-xs font-bold">{step.time}</span>
                      <StatusDot status={step.status} />
                    </div>
                  </div>
                  <div className="p-8 bg-white grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div className="space-y-4">
                      <p className="text-sm text-slate-600 leading-relaxed">{step.desc}</p>
                      <div className="bg-slate-50 rounded-2xl p-4 border border-slate-100">
                        <p className="text-xs font-black text-slate-500 uppercase tracking-widest mb-3">Campos requeridos</p>
                        <ul className="space-y-2">
                          {step.fields.map((f, j) => (
                            <li key={j} className="flex items-start gap-2 text-xs text-slate-600">
                              <span className="text-slate-300 font-black mt-0.5 flex-shrink-0">·</span>
                              {f}
                            </li>
                          ))}
                        </ul>
                      </div>
                    </div>
                    <div className="bg-amber-50 rounded-2xl p-4 border border-amber-200 self-start">
                      <p className="text-xs font-black text-amber-700 uppercase tracking-widest mb-2">Regla crítica</p>
                      <p className="text-xs text-slate-700 leading-relaxed">{step.rule}</p>
                    </div>
                  </div>
                </div>
              ))}
            </div>

            {/* Emergency Call */}
            <div className="bg-red-50 border-2 border-dashed border-red-300 rounded-3xl p-8 flex flex-col md:flex-row gap-6 items-start">
              <div className="bg-red-600 text-white text-xs font-black px-3 py-1.5 rounded-xl uppercase tracking-widest flex-shrink-0 self-start">Paso separado</div>
              <div className="space-y-3 flex-1">
                <p className="font-black text-red-800 uppercase tracking-tight">Emergency Call Registration</p>
                <p className="text-sm text-slate-700 leading-relaxed">
                  Cada número necesita Emergency Call Registration de forma independiente al A2P Campaign. Esto es un requerimiento de Twilio — si falta, cobran <strong className="text-red-700">$75 por número</strong>. Es un registro rápido, una sola vez, por número, en el console de Twilio bajo "Phone Numbers → Manage → Emergency Calling."
                </p>
                <p className="text-xs font-bold text-red-700">Estado: Pendiente · Mauricio · Hacer antes de escalar volumen de SMS</p>
              </div>
              <div className="flex-shrink-0 text-center">
                <p className="text-5xl font-black text-red-600">$75</p>
                <p className="text-xs text-red-500 font-black uppercase tracking-widest">por número<br/>si se omite</p>
              </div>
            </div>
          </section>

          {/* ESTADO POR CLIENTE */}
          <section className="space-y-8">
            <h2 className="text-2xl font-black uppercase tracking-tighter text-slate-900">
              Estado actual — por cliente
            </h2>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {/* PTS Tax */}
              <div className="rounded-3xl border-2 border-blue-200 overflow-hidden shadow-sm">
                <div className="bg-blue-700 px-8 py-4 flex items-center justify-between">
                  <span className="text-white font-black text-base uppercase tracking-tight">PTS Tax</span>
                  <StatusDot status="active" />
