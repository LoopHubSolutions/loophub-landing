<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Twilio — Voice & SMS Infrastructure · PTS AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
    body { font-family: 'Inter', sans-serif; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    .animate-pulse { animation: pulse 2s cubic-bezier(.4,0,.6,1) infinite; }
  </style>
</head>
<body class="bg-white text-slate-900">
  <div id="root"></div>

  <script type="text/babel">

    const StatusDot = ({ status }) => {
      const map = {
        done:    { bg: 'bg-emerald-500',              label: 'Done',        text: 'text-emerald-700', light: 'bg-emerald-50 border-emerald-200' },
        active:  { bg: 'bg-blue-500 animate-pulse',   label: 'In progress', text: 'text-blue-700',    light: 'bg-blue-50 border-blue-200' },
        pending: { bg: 'bg-amber-400',                label: 'Pending',     text: 'text-amber-700',   light: 'bg-amber-50 border-amber-200' },
        blocked: { bg: 'bg-red-500',                  label: 'Blocked',     text: 'text-red-700',     light: 'bg-red-50 border-red-200' },
      };
      const s = map[status] || map.pending;
      return (
        <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-black uppercase tracking-widest border ${s.light} ${s.text}`}>
          <span className={`w-1.5 h-1.5 rounded-full ${s.bg} flex-shrink-0`} />
          {s.label}
        </span>
      );
    };

    const CheckRow = ({ label, status, note }) => {
      const icon = status === 'done' ? '✓' : status === 'active' ? '◉' : status === 'blocked' ? '✕' : '○';
      const color = status === 'done' ? 'text-emerald-600' : status === 'active' ? 'text-blue-600' : status === 'blocked' ? 'text-red-500' : 'text-amber-500';
      return (
        <div className="flex items-start gap-3 py-3 border-b border-slate-100 last:border-0">
          <span className={`font-black text-sm mt-0.5 flex-shrink-0 ${color}`}>{icon}</span>
          <div className="flex-1 min-w-0">
            <p className="text-sm font-bold text-slate-800">{label}</p>
            {note && <p className="text-xs text-slate-400 mt-0.5">{note}</p>}
          </div>
          <StatusDot status={status} />
        </div>
      );
    };

    const FAQItem = ({ q, a }) => {
      const [open, setOpen] = React.useState(false);
      return (
        <div className="border border-slate-200 rounded-2xl overflow-hidden">
          <button onClick={() => setOpen(!open)} className="w-full flex items-start justify-between gap-4 p-5 text-left hover:bg-slate-50 transition-colors">
            <span className="text-sm font-bold text-slate-800 leading-snug">{q}</span>
            <span className={`text-lg font-black flex-shrink-0 mt-0.5 transition-colors ${open ? 'text-red-600' : 'text-slate-300'}`}>{open ? '−' : '+'}</span>
          </button>
          {open && (
            <div className="px-5 pb-5 bg-red-50 border-t border-red-100">
              <p className="text-sm text-slate-600 leading-relaxed pt-4">{a}</p>
            </div>
          )}
        </div>
      );
    };

    const App = () => (
      <div className="min-h-screen bg-white text-slate-900">

        {/* HEADER */}
        <header className="border-b border-slate-200 bg-white sticky top-0 z-50 shadow-sm">
          <div className="max-w-6xl mx-auto px-6">
            {/* Brand row */}
            <div className="flex items-center justify-between gap-4 py-3 border-b border-slate-100">
              <div className="flex items-center gap-3">
                <img src="/images/twilio-logo.png" alt="Twilio" className="h-7 object-contain" />
                <div className="border-l border-slate-200 pl-3">
                  <p className="text-sm font-black uppercase tracking-tight text-slate-900 leading-none">PTS AI</p>
                  <p className="text-xs text-slate-400 font-bold uppercase tracking-widest italic">Operational Platform · 2026</p>
                </div>
              </div>
              <div className="flex gap-5">
                <div className="text-right">
                  <p className="text-xs font-black text-slate-400 uppercase tracking-tighter">PTS Tax</p>
                  <p className="text-sm font-black text-amber-600">A2P in progress</p>
                </div>
                <div className="text-right border-l border-slate-200 pl-5">
                  <p className="text-xs font-black text-slate-400 uppercase tracking-tighter">Sunset Finance</p>
                  <p className="text-sm font-black text-red-600">Not started</p>
                </div>
              </div>
            </div>
            {/* Nav tabs */}
            <div className="flex gap-1 py-2">
              <a href="/georgia-dashboard" className="flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-black uppercase tracking-widest text-slate-400 hover:text-slate-700 hover:bg-slate-50 transition-colors">
                <span className="w-1.5 h-1.5 rounded-full bg-blue-500 flex-shrink-0" />
                Georgia FOIA Campaign
              </a>
              <a href="/twilio-setup" className="flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-black uppercase tracking-widest bg-red-600 text-white">
                <span className="w-1.5 h-1.5 rounded-full bg-white flex-shrink-0" />
                Twilio — Voice & SMS
              </a>
            </div>
          </div>
        </header>

        <main className="max-w-5xl mx-auto px-6 py-16 space-y-24 pb-32">

          {/* THIS WEEK */}
          <section className="bg-slate-950 rounded-[40px] p-10 text-white space-y-8">
            <div>
              <p className="text-xs font-black text-red-400 uppercase tracking-widest mb-2">Action required now</p>
              <h2 className="text-3xl font-black uppercase tracking-tighter leading-none">
                This week —<br />
                <span className="text-red-400">what needs to happen</span>
              </h2>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {[
                { owner: 'Mauricio', action: 'Confirm A2P Campaign status with Twilio Support', note: 'Ticket is already open — we need an ETA on approval', urgent: true },
                { owner: 'Mauricio', action: 'Emergency Call Registration on all PTS Tax numbers', note: '$75/number penalty if skipped — do this before scaling volume', urgent: true },
                { owner: 'Yeison', action: 'STOP → Zoho Do Not Contact in N8N', note: 'Twilio blocks the number, but the CRM also needs to be updated', urgent: false },
                { owner: 'Jason', action: 'Prepare test plan for Connie SMS', note: 'Test AT&T, T-Mobile, Xfinity once A2P is approved', urgent: false },
              ].map((item, i) => (
                <div key={i} className={`rounded-2xl p-5 flex items-start gap-4 ${item.urgent ? 'bg-red-950 border border-red-800' : 'bg-slate-900 border border-slate-800'}`}>
                  <div className={`w-2 h-2 rounded-full flex-shrink-0 mt-1.5 ${item.urgent ? 'bg-red-500' : 'bg-slate-600'}`} />
                  <div className="flex-1">
                    <div className="flex items-center gap-2 mb-1">
                      <span className="text-xs font-black text-slate-400 uppercase tracking-widest">{item.owner}</span>
                      {item.urgent && <span className="bg-red-500 text-white text-xs font-black px-2 py-0.5 rounded-full uppercase tracking-widest">Urgent</span>}
                    </div>
                    <p className="text-sm font-bold text-white leading-snug">{item.action}</p>
                    <p className="text-xs text-slate-400 mt-1">{item.note}</p>
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* ALREADY DONE */}
          <section className="space-y-8">
            <div>
              <p className="text-xs font-black text-emerald-600 uppercase tracking-widest mb-2">Real progress</p>
              <h2 className="text-3xl font-black uppercase tracking-tighter leading-none text-slate-900">
                Already <span className="text-emerald-600">done</span>
              </h2>
              <p className="text-slate-400 text-sm mt-2">This is complete. We don't go back from here.</p>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              {[
                { label: 'Twilio account active', sub: 'Both clients — PTS Tax and Sunset Finance have console access' },
                { label: 'Business Profile — PTS Tax', sub: 'EIN registered, address confirmed — step 1 of 4 complete' },
                { label: 'Brand (TCR) submitted', sub: 'PTS Tax — under review with TCR, approval in 24–72h' },
                { label: 'A2P Campaign submitted to carriers', sub: 'PTS Tax — under review · Tony approved the Twilio support upgrade on May 15 — that unlocked the process' },
                { label: 'Branded Calling — Sunset Finance', sub: '10 branches active — company name shows on the recipient\'s screen' },
                { label: 'Twilio numbers purchased', sub: 'Numbers assigned per client — ready to attach to Campaign once approved' },
                { label: 'SHAFT rules documented', sub: 'Team knows what content is prohibited and why' },
                { label: 'Connie connected to Twilio', sub: 'Voice integration working — calls go out and in correctly' },
              ].map((item, i) => (
                <div key={i} className="flex items-start gap-4 bg-emerald-50 border border-emerald-200 rounded-2xl p-5">
                  <span className="text-emerald-600 font-black text-lg flex-shrink-0 mt-0.5">✓</span>
                  <div>
                    <p className="text-sm font-black text-slate-900">{item.label}</p>
                    <p className="text-xs text-slate-500 mt-0.5">{item.sub}</p>
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* UPCOMING MILESTONES */}
          <section className="space-y-8">
            <div>
              <p className="text-xs font-black text-blue-600 uppercase tracking-widest mb-2">What's next</p>
              <h2 className="text-3xl font-black uppercase tracking-tighter leading-none text-slate-900">
                Upcoming <span className="text-blue-600">milestones</span>
              </h2>
            </div>
            <div className="space-y-3">
              {[
                { dot: 'bg-amber-400', when: 'This week', label: 'A2P Campaign approved by carriers — PTS Tax', trigger: 'Unlocked by the Twilio support upgrade approved May 15' },
                { dot: 'bg-amber-400', when: 'This week', label: 'Emergency Call Registration complete — all numbers', trigger: 'Mauricio does this in console before scaling SMS volume' },
                { dot: 'bg-blue-500', when: 'Next 2 weeks', label: 'Connie SMS live — PTS Tax · AT&T, T-Mobile, Xfinity tests', trigger: 'Jason runs tests once A2P approved' },
                { dot: 'bg-blue-500', when: 'Week 3', label: 'Business Profile + Brand for Sunset Finance initiated', trigger: 'Starts after PTS Tax is 100% operational' },
                { dot: 'bg-slate-400', when: 'June 1, 2026', label: 'SMS live — Sunset Finance', trigger: 'Goal: A2P complete before June 1' },
              ].map((m, i) => (
                <div key={i} className="flex items-start gap-4 p-5 rounded-2xl border border-slate-100 bg-white hover:bg-slate-50 transition-colors">
                  <span className={`w-3 h-3 rounded-full ${m.dot} flex-shrink-0 mt-1`} />
                  <div className="flex-1">
                    <p className="text-sm font-black text-slate-900">{m.label}</p>
                    <p className="text-xs text-slate-400 mt-0.5">{m.trigger}</p>
                  </div>
                  <span className="bg-slate-100 text-slate-600 text-xs font-black px-3 py-1 rounded-full uppercase tracking-widest flex-shrink-0">{m.when}</span>
                </div>
              ))}
            </div>
          </section>

          {/* WHY REGISTER */}
          <section className="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
            <div className="space-y-5">
              <p className="text-xs font-black text-red-600 uppercase tracking-widest">Before touching anything</p>
              <h2 className="text-4xl font-black uppercase tracking-tighter leading-none text-slate-900">
                No registration.<br />
                <span className="text-red-600">No messages.</span>
              </h2>
              <p className="text-slate-500 text-base leading-relaxed">
                Twilio is just the pipe. AT&T, T-Mobile, and Verizon are the real network. They block any SMS or call volume that isn't pre-registered — automatically, algorithmically, without notice.
              </p>
              <p className="text-slate-500 text-base leading-relaxed">
                This page is the exact sequence to go live. One step out of order and the entire campaign gets blocked.
              </p>
            </div>
            <div className="bg-slate-900 rounded-[32px] p-8 text-white space-y-4">
              <p className="text-xs font-black text-slate-400 uppercase tracking-widest">The carrier rule</p>
              <p className="text-2xl font-black italic leading-snug text-white">
                "If it looks like automated bulk messaging and it's not registered — we block it."
              </p>
              <p className="text-xs text-slate-500 font-bold">— AT&T, T-Mobile, Verizon (collectively)</p>
            </div>
          </section>

          {/* 3 RULES */}
          <section className="space-y-8">
            <div>
              <h2 className="text-2xl font-black uppercase tracking-tighter text-slate-900">3 Rules that cannot be broken</h2>
              <p className="text-slate-500 text-sm mt-2">These aren't recommendations. Violating any one of them can suspend the entire account.</p>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
              {[
                {
                  n: '01',
                  title: 'Consent First',
                  color: 'border-blue-300 bg-blue-50',
                  headColor: 'text-blue-700',
                  penalty: '$500–$1,500',
                  penaltySub: 'per message / call · class action lawsuit risk',
                  body: 'Before Connie sends an SMS or makes an automated call, the prospect must have given consent. For the FOIA list: consent = replying to the SmartLead email. No reply = no call (or Tony signs a written risk authorization for TCPA exposure).',
                },
                {
                  n: '02',
                  title: 'STOP = Full stop',
                  color: 'border-red-300 bg-red-50',
                  headColor: 'text-red-700',
                  penalty: '$500–$1,500',
                  penaltySub: 'per message sent after STOP · no grace period',
                  body: 'If a prospect replies STOP to any SMS, they must be removed from all automated outreach immediately. Twilio blocks the number, but N8N must sync it to Zoho as Do Not Contact. Every message sent after a STOP is a separate TCPA violation.',
                },
                {
                  n: '03',
                  title: 'Volume Warmup',
                  color: 'border-emerald-300 bg-emerald-50',
                  headColor: 'text-emerald-700',
                  penalty: 'Number blocked',
                  penaltySub: 'by carrier · recovery = new number + restart warmup',
                  body: 'New numbers start slow. Week 1: max 200 SMS/day per number. Week 2: max 500. Week 3+: up to ~2,000. Sending 5,000 messages on day one from a new number looks exactly like a botnet — the carrier blocks it automatically.',
                },
              ].map((rule, i) => (
                <div key={i} className={`rounded-3xl border-2 ${rule.color} p-8 space-y-4`}>
                  <div>
                    <span className={`text-xs font-black ${rule.headColor} uppercase tracking-widest`}>{rule.n}</span>
                    <h3 className={`text-xl font-black uppercase tracking-tight ${rule.headColor} mt-1`}>{rule.title}</h3>
                  </div>
                  <p className="text-sm text-slate-700 leading-relaxed">{rule.body}</p>
                  <div className="bg-white/80 rounded-xl p-4 border border-white space-y-1">
                    <p className="text-xs font-black text-slate-500 uppercase tracking-widest">If broken</p>
                    <p className="text-2xl font-black text-red-600 leading-none">{rule.penalty}</p>
                    <p className="text-xs text-slate-500">{rule.penaltySub}</p>
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* THE 4 STEPS */}
          <section className="space-y-10">
            <div className="space-y-2">
              <h2 className="text-2xl font-black uppercase tracking-tighter text-slate-900">
                The 4 A2P registration steps
              </h2>
              <p className="text-slate-500 text-sm">In order. Each step unlocks the next. None can be skipped.</p>
            </div>

            <div className="space-y-4">
              {[
                {
                  n: '01',
                  title: 'Business Profile',
                  headerBg: 'bg-slate-800',
                  color: 'border-slate-300',
                  desc: 'Your legal identity inside Twilio. Tells the carrier network who is sending the messages.',
                  fields: ['Legal business name (must match EIN)', 'EIN / Tax ID', 'Business address', 'Website URL', 'Entity type (LLC / Corp / Private)'],
                  rule: 'One Business Profile per entity. PTS Tax and Sunset Finance are separate entities → separate profiles.',
                  time: '~10 min · instant approval',
                  status: 'done',
                },
                {
                  n: '02',
                  title: 'Brand (TCR)',
                  headerBg: 'bg-blue-700',
                  color: 'border-blue-300',
                  desc: 'The Brand connects your Business Profile to The Campaign Registry (TCR) — the central database all carriers check before allowing SMS traffic.',
                  fields: ['Brand name (what carriers see)', 'Website (must match Business Profile)', 'Vertical / industry (Financial Services)', 'Stock ticker if public (N/A for private companies)'],
                  rule: 'TCR cross-references your info with D&B (Dun & Bradstreet). Inconsistencies = rejection. The brand name in Twilio must match what appears on your website.',
                  time: '~15 min · TCR approval: 24–72 hours',
                  status: 'active',
                },
                {
                  n: '03',
                  title: 'Campaign (Use case)',
                  headerBg: 'bg-orange-600',
                  color: 'border-orange-300',
                  desc: 'The Campaign declares exactly what you\'re sending and to whom. Carriers evaluate this to determine if your traffic is legitimate.',
                  fields: [
                    'Use type: Mixed / Marketing / Conversational',
                    'Description: what Connie says, why, to whom',
                    'Sample messages (2 required — must match real messages)',
                    'Opt-in confirmation: how did prospects consent?',
                    'Privacy Policy URL (must mention SMS)',
                    'HELP / STOP responses declared',
                  ],
                  rule: 'The sample messages you submit are compared against real traffic. If Connie sends different messages, carriers flag it. Write the samples as close to the actual scripts as possible.',
                  time: '~20 min · carrier review: 1–3 weeks',
                  status: 'active',
                },
                {
                  n: '04',
                  title: 'Numbers → Campaign',
                  headerBg: 'bg-emerald-700',
                  color: 'border-emerald-300',
                  desc: 'Each physical phone number must be assigned to a Campaign. A number without a Campaign assignment is blocked for A2P traffic.',
                  fields: [
                    'Assign each Connie number to the approved Campaign',
                    'One Campaign per use case (outreach ≠ confirmations)',
                    'PTS Tax numbers → PTS Tax Campaign',
                    'Sunset Finance numbers → Sunset Finance Campaign (separate)',
                  ],
                  rule: 'Don\'t use the same number for different use cases. If Connie calls for PTS Tax and Sunset Finance, you need different numbers assigned to different Campaigns.',
                  time: 'Instant — done inside Twilio once Campaign is approved',
                  status: 'pending',
                },
              ].map((step, i) => (
                <div key={i} className={`rounded-3xl border-2 ${step.color} overflow-hidden shadow-sm`}>
                  <div className={`${step.headerBg} px-8 py-4 flex items-center justify-between`}>
                    <div className="flex items-center gap-4">
                      <span className="bg-white/20 text-white text-xs font-black w-8 h-8 rounded-xl flex items-center justify-center">{step.n}</span>
                      <span className="text-white font-black text-base uppercase tracking-tight">{step.title}</span>
                    </div>
                    <div className="flex items-center gap-3">
                      <span className="text-white/60 text-xs font-bold">{step.time}</span>
                      <StatusDot status={step.status} />
                    </div>
                  </div>
                  <div className="p-8 bg-white grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div className="space-y-4">
                      <p className="text-sm text-slate-600 leading-relaxed">{step.desc}</p>
                      <div className="bg-slate-50 rounded-2xl p-4 border border-slate-100">
                        <p className="text-xs font-black text-slate-500 uppercase tracking-widest mb-3">Required fields</p>
                        <ul className="space-y-2">
                          {step.fields.map((f, j) => (
                            <li key={j} className="flex items-start gap-2 text-xs text-slate-600">
                              <span className="text-slate-300 font-black mt-0.5 flex-shrink-0">·</span>
                              {f}
                            </li>
                          ))}
                        </ul>
                      </div>
                    </div>
                    <div className="bg-amber-50 rounded-2xl p-4 border border-amber-200 self-start">
                      <p className="text-xs font-black text-amber-700 uppercase tracking-widest mb-2">Critical rule</p>
                      <p className="text-xs text-slate-700 leading-relaxed">{step.rule}</p>
                    </div>
                  </div>
                </div>
              ))}
            </div>

            {/* Emergency Call */}
            <div className="bg-red-50 border-2 border-dashed border-red-300 rounded-3xl p-8 flex flex-col md:flex-row gap-6 items-start">
              <div className="bg-red-600 text-white text-xs font-black px-3 py-1.5 rounded-xl uppercase tracking-widest flex-shrink-0 self-start">Separate step</div>
              <div className="space-y-3 flex-1">
                <p className="font-black text-red-800 uppercase tracking-tight">Emergency Call Registration</p>
                <p className="text-sm text-slate-700 leading-relaxed">
                  Each number needs Emergency Call Registration independently from the A2P Campaign. This is a Twilio requirement — if skipped, they charge <strong className="text-red-700">$75 per number</strong>. It's a quick, one-time registration per number, done in the Twilio console under "Phone Numbers → Manage → Emergency Calling."
                </p>
                <p className="text-xs font-bold text-red-700">Status: Pending · Mauricio · Do before scaling SMS volume</p>
              </div>
              <div className="flex-shrink-0 text-center">
                <p className="text-5xl font-black text-red-600">$75</p>
                <p className="text-xs text-red-500 font-black uppercase tracking-widest">per number<br/>if skipped</p>
              </div>
            </div>
          </section>

          {/* STATUS BY CLIENT */}
          <section className="space-y-8">
            <h2 className="text-2xl font-black uppercase tracking-tighter text-slate-900">
              Current status — by client
            </h2>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {/* PTS Tax */}
              <div className="rounded-3xl border-2 border-blue-200 overflow-hidden shadow-sm">
                <div className="bg-blue-700 px-8 py-4 flex items-center justify-between">
                  <span className="text-white font-black text-base uppercase tracking-tight">PTS Tax</span>
                  <StatusDot status="active" />
                </div>
                <div className="p-6 bg-white space-y-1">
                  <CheckRow label="Business Profile" status="done" note="EIN registered, address confirmed" />
                  <CheckRow label="Brand (TCR)" status="active" note="Submitted — awaiting TCR approval (24–72h)" />
                  <CheckRow label="A2P Campaign" status="active" note="In progress with Twilio support" />
                  <CheckRow label="Numbers → Campaign" status="pending" note="Blocked until Campaign is approved" />
                  <CheckRow label="Emergency Call Registration" status="pending" note="$75/number penalty if skipped" />
                  <CheckRow label="Connie SMS tests (AT&T, T-Mobile, Xfinity)" status="pending" note="Jason runs tests post A2P approval" />
                  <CheckRow label="STOP → N8N → Zoho Do Not Contact" status="pending" note="Yeison connects opt-out to CRM" />
                </div>
              </div>

              {/* Sunset Finance */}
              <div className="rounded-3xl border-2 border-orange-200 overflow-hidden shadow-sm">
                <div className="bg-orange-600 px-8 py-4 flex items-center justify-between">
                  <span className="text-white font-black text-base uppercase tracking-tight">Sunset Finance</span>
                  <StatusDot status="pending" />
                </div>
                <div className="p-6 bg-white space-y-1">
                  <CheckRow label="Branded Calling (10 branches)" status="done" note="Complete — company name shows when receiving the call" />
                  <CheckRow label="Business Profile (Sunset entity)" status="pending" note="Separate from PTS Tax — needs its own profile with EIN" />
                  <CheckRow label="Brand (TCR)" status="pending" note="Not started — begins after PTS Tax completes" />
                  <CheckRow label="A2P Campaign" status="pending" note="Required before SMS launch on June 1" />
                  <CheckRow label="Numbers → Campaign" status="pending" note="Blocked until Campaign is approved" />
                  <CheckRow label="Emergency Call Registration" status="pending" note="All 10 branch numbers need this" />
                </div>
              </div>
            </div>
          </section>

          {/* PROHIBITED CONTENT — SHAFT */}
          <section className="space-y-8">
            <div>
              <h2 className="text-2xl font-black uppercase tracking-tighter text-slate-900">Prohibited content — SHAFT</h2>
